<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LIGHTNING COIN</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f17;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .app {
      padding: 25px 15px 30px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .user {
      color: #9da6b5;
      font-size: 14px;
    }

    .balance {
      margin-top: 25px;
      font-size: 38px;
      font-weight: bold;
    }

    .coin-name {
      color: #9da6b5;
      font-size: 14px;
    }

    .coin {
      width: 220px;
      height: 220px;
      margin: 30px auto;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 100px;

      background: linear-gradient(
        145deg,
        #ffe66d,
        #ffb300,
        #ff8c00
      );

      box-shadow:
        0 0 25px #ffb300,
        0 0 60px rgba(255, 179, 0, 0.35);

      user-select: none;
      cursor: pointer;

      transition: transform 0.08s;
    }

    .coin:active {
      transform: scale(0.90);
    }

    .plus {
      position: fixed;
      font-size: 25px;
      font-weight: bold;
      color: #ffd54f;
      pointer-events: none;
      animation: up 0.7s forwards;
    }

    @keyframes up {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(-80px);
      }
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      padding: 18px 10px;
      border-radius: 18px;
      background: #151c28;
      color: white;
      font-size: 15px;
      border: 1px solid #222c3c;
    }

    .button span {
      display: block;
      font-size: 27px;
      margin-bottom: 7px;
    }

    .lang {
      margin-top: 20px;
      padding: 12px;
      border-radius: 14px;
      background: #151c28;
      color: white;
      border: 1px solid #222c3c;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="title">⚡ LIGHTNING COIN</div>

  <div class="user" id="user">
    User
  </div>

  <div class="balance">
    🪙 <span id="coins">0</span>
  </div>

  <div class="coin-name">
    LIGHT COIN
  </div>

  <div class="coin" onclick="tapCoin(event)">
    🪙
  </div>

  <div class="menu">

    <div class="button">
      <span>🔨</span>
      Auksion
    </div>

    <div class="button">
      <span>🎁</span>
      Bonus
    </div>

    <div class="button">
      <span>👥</span>
      Referal
    </div>

    <div class="button">
      <span>🏆</span>
      Reyting
    </div>

  </div>

  <select class="lang" id="language">
    <option value="uz">🇺🇿 O‘zbek</option>
    <option value="ru">🇷🇺 Русский</option>
    <option value="ko">🇰🇷 한국어</option>
    <option value="hi">🇮🇳 हिन्दी</option>
  </select>

</div>

<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  let coins = 0;

  const user = tg.initDataUnsafe?.user;

  if (user) {
    document.getElementById("user").textContent =
      "👤 " + (user.first_name || user.username || "User");
  }

  function tapCoin(event) {

    coins++;

    document.getElementById("coins").textContent =
      coins.toLocaleString();

    const plus = document.createElement("div");

    plus.className = "plus";
    plus.textContent = "+1 🪙";

    plus.style.left = event.clientX + "px";
    plus.style.top = event.clientY + "px";

    document.body.appendChild(plus);

    setTimeout(() => {
      plus.remove();
    }, 700);
  }

</script>

</body>
</html
